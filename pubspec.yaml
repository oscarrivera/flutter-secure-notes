name: flutter_secure_notes
description: Local-only encrypted notes with PIN lock and AES-GCM at rest.
publish_to: none
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  cryptography: ^2.7.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.8

flutter:
  uses-material-design: true
